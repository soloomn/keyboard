    <!-- Заголовок сразу вверху -->
    <div class="title reveal-title">
        KEYBOARD
    </div>

    <!-- Текст который будет печататься -->
    <div class="text-display" id="textDisplay">
        <span id="typedText"></span><span class="cursor" id="cursor"></span>
    </div>

    <!-- Клавиатура -->
    <div class="keyboard-area">
        <div class="halo pulse" aria-hidden="true"></div>
        <div class="keyboard reveal-keyboard">
        <!-- Ряд F-клавиш -->
        <div class="key-row">
            <div class="key">Esc</div>
            <div class="key">F1</div>
            <div class="key">F2</div>
            <div class="key">F3</div>
            <div class="key">F4</div>
            <div class="key">F5</div>
            <div class="key">F6</div>
            <div class="key">F7</div>
            <div class="key">F8</div>
            <div class="key">F9</div>
            <div class="key">F10</div>
            <div class="key">F11</div>
            <div class="key">F12</div>
        </div>

        <!-- Ряд цифр -->
        <div class="key-row">
            <div class="key">
                <span class="key-top">~</span>
                <span class="key-main">`</span>
            </div>
            <div class="key">
                <span class="key-top">!</span>
                <span class="key-main">1</span>
            </div>
            <div class="key">
                <span class="key-top">@</span>
                <span class="key-main">2</span>
            </div>
            <div class="key">
                <span class="key-top">#</span>
                <span class="key-main">3</span>
            </div>
            <div class="key">
                <span class="key-top">$</span>
                <span class="key-main">4</span>
            </div>
            <div class="key">
                <span class="key-top">%</span>
                <span class="key-main">5</span>
            </div>
            <div class="key">
                <span class="key-top">^</span>
                <span class="key-main">6</span>
            </div>
            <div class="key">
                <span class="key-top">&</span>
                <span class="key-main">7</span>
            </div>
            <div class="key">
                <span class="key-top">*</span>
                <span class="key-main">8</span>
            </div>
            <div class="key">
                <span class="key-top">(</span>
                <span class="key-main">9</span>
            </div>
            <div class="key">
                <span class="key-top">)</span>
                <span class="key-main">0</span>
            </div>
            <div class="key w-105">←</div>
        </div>

        <!-- Ряд QWERTY -->
        <div class="key-row">
            <div class="key w-75">Tab<br>→</div>
            <div class="key" data-key="q">Q</div>
            <div class="key" data-key="w">W</div>
            <div class="key" data-key="e">E</div>
            <div class="key" data-key="r">R</div>
            <div class="key" data-key="t">T</div>
            <div class="key" data-key="y">Y</div>
            <div class="key" data-key="u">U</div>
            <div class="key" data-key="i">I</div>
            <div class="key" data-key="o">O</div>
            <div class="key" data-key="p">P</div>
            <div class="key">
                <span class="key-top">{</span>
                <span class="key-main">[</span>
            </div>
            <div class="key">
                <span class="key-top">}</span>
                <span class="key-main">]</span>
            </div>
        </div>

        <!-- Ряд ASDF -->
        <div class="key-row">
            <div class="key w-85">⇪</div>
            <div class="key" data-key="a">A</div>
            <div class="key" data-key="s">S</div>
            <div class="key" data-key="d">D</div>
            <div class="key" data-key="f">F</div>
            <div class="key" data-key="g">G</div>
            <div class="key" data-key="h">H</div>
            <div class="key" data-key="j">J</div>
            <div class="key" data-key="k">K</div>
            <div class="key" data-key="l">L</div>
            <div class="key">
                <span class="key-top">:</span>
                <span class="key-main">;</span>
            </div>
            <div class="key">
                <span class="key-top">"</span>
                <span class="key-main">'</span>
            </div>
            <div class="key w-85">⏎</div>
        </div>

        <!-- Ряд ZXCV -->
        <div class="key-row">
            <div class="key w-150">⇧</div>
            <div class="key" data-key="z">Z</div>
            <div class="key" data-key="x">X</div>
            <div class="key" data-key="c">C</div>
            <div class="key" data-key="v">V</div>
            <div class="key" data-key="b">B</div>
            <div class="key" data-key="n">N</div>
            <div class="key" data-key="m">M</div>
            <div class="key">
                <span class="key-top">&lt;</span>
                <span class="key-main">,</span>
            </div>
            <div class="key">
                <span class="key-top">&gt;</span>
                <span class="key-main">.</span>
            </div>
            <div class="key w-150">⇧</div>
        </div>

        <!-- Нижний ряд -->
        <div class="key-row">
            <div class="key w-70" aria-label="Control">
                <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <text x="12" y="12" dominant-baseline="middle" text-anchor="middle">⌃</text>
                </svg>
            </div>
            <div class="key w-70" aria-label="Option">
                <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <text x="12" y="12" dominant-baseline="middle" text-anchor="middle">⌥</text>
                </svg>
            </div>
            <div class="key w-70" aria-label="Command">
                <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <text x="12" y="12" dominant-baseline="middle" text-anchor="middle">⌘</text>
                </svg>
            </div>
            <div class="key w-300" data-key=" "></div>
            <div class="key w-70" aria-label="Command">
                <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <text x="12" y="12" dominant-baseline="middle" text-anchor="middle">⌘</text>
                </svg>
            </div>
            <div class="key w-70" aria-label="Option">
                <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <text x="12" y="12" dominant-baseline="middle" text-anchor="middle">⌥</text>
                </svg>
            </div>
            <div class="key w-70" aria-label="Control">
                <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <text x="12" y="12" dominant-baseline="middle" text-anchor="middle">⌃</text>
                </svg>
            </div>
            <div class="key w-60">Fn</div>
        </div>
        </div>
    </div>
    <div class="smoke" aria-hidden="true"></div>
